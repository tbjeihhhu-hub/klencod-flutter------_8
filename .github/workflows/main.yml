
name: Build Flutter AAB and Signed APK

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: true
        default: '3.47.2'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true
          channel: stable

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TAJER_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TAJER_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TAJER_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAJER_KEY_ALIAS }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

          python3 - <<'PY'
          import os

          def escape(value):
              return (value.replace("\\", "\\\\")
                           .replace(":", "\\:")
                           .replace("=", "\\=")
                           .replace(" ", "\\ ")
                           .replace("#", "\\#")
                           .replace("!", "\\!"))

          values = {
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["KEY_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "storeFile": "upload-keystore.jks",
          }

          with open("android/key.properties", "w") as f:
              for key, value in values.items():
                  f.write(f"{key}={escape(value)}\n")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Build signed APK
        run: flutter build apk --release

      - name: Verify AAB and APK signatures
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TAJER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAJER_KEY_ALIAS }}
        run: |
          set -e

          KEYSTORE="android/app/upload-keystore.jks"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "Checking AAB signature..."
          jarsigner -verify "$AAB" > /dev/null
          keytool -printcert -jarfile "$AAB" > aab-cert.txt

          AAB_FP=$(grep -i 'SHA256:' aab-cert.txt | head -n 1 | sed 's/.*: *//' | tr -d ': \r')

          echo "Checking APK signature..."
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > apk-cert.txt

          APK_FP=$(grep -i 'SHA-256 digest:' apk-cert.txt | head -n 1 | sed 's/.*: *//' | tr -d ': \r')

          echo "Reading original keystore certificate..."
          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file original-cert.der

          keytool -printcert -file original-cert.der > original-cert.txt

          KEY_FP=$(grep -i 'SHA256:' original-cert.txt | head -n 1 | sed 's/.*: *//' | tr -d ': \r')

          test -n "$AAB_FP" || { echo "AAB fingerprint missing"; exit 1; }
          test -n "$APK_FP" || { echo "APK fingerprint missing"; exit 1; }
          test -n "$KEY_FP" || { echo "Keystore fingerprint missing"; exit 1; }

          if [ "$AAB_FP" = "$KEY_FP" ] && [ "$APK_FP" = "$KEY_FP" ]; then
            echo "SUCCESS: AAB and APK match the original signing key."
          else
            echo "ERROR: Signing certificate mismatch."
            exit 1
          fi

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: TAJER-release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TAJER-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
