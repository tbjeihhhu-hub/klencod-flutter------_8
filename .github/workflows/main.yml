
name: Build Flutter AAB

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version'
        required: true
        default: '3.47.2'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true
          channel: stable

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TAJER_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TAJER_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TAJER_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAJER_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

          python3 - <<'PY'
          import os

          def escape(value):
              return (value.replace("\\", "\\\\")
                           .replace(":", "\\:")
                           .replace("=", "\\=")
                           .replace(" ", "\\ ")
                           .replace("#", "\\#")
                           .replace("!", "\\!"))

          values = {
              "storePassword": os.environ["KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["KEY_PASSWORD"],
              "keyAlias": os.environ["KEY_ALIAS"],
              "storeFile": "upload-keystore.jks",
          }

          with open("android/key.properties", "w") as f:
              for key, value in values.items():
                  f.write(f"{key}={escape(value)}\n")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Verify AAB signature
        run: |
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab > signature-check.txt 2>&1
          cat signature-check.txt
          grep -Fq "jar verified." signature-check.txt

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TAJER-release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
